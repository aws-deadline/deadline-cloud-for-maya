[envs.default]
pre-install-commands = [
  "pip install -r requirements-testing.txt"
]

[envs.default.scripts]
sync = "pip install -r requirements-testing.txt"
test = "pytest --cov-config pyproject.toml {args:test/unit}"
test-installer = "pytest --no-cov {args:test/installer} -vvv"
typing = "mypy {args:src test maya_submitter_plugin/plug-ins}"
style = [
  "ruff check {args:.}",
  "black --check --diff {args:.}",
]
fmt = [
  "black {args:.}",
  "style",
]
lint = [
  "style",
  "typing",
]
install = "python {root}/scripts/install_dev_submitter.py {args:}"

[[envs.all.matrix]]
python = ["3.9", "3.10", "3.11", "3.12"]

[envs.default.env-vars]
MAYA_ENV_DIR="{root}/plugin_env"

[envs.integ]
pre-install-commands = [
  "mayapy -m pip install -r requirements-integ-testing.txt",
  "mayapy -m pip install -r requirements-testing.txt",
]

[envs.integ.scripts]
test = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1'
test_submitters = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m submitter'
test_adaptors_all = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m adaptor'
test_adaptors_maya = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and maya_renderer"'
test_adaptors_mtoa = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and mtoa_renderer"'
test_adaptors_vray = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and vray_renderer"'
test_adaptors_redshift = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and redshift_renderer"'

[envs.integ-ci]
pre-install-commands = [
  "pip install -r requirements-integ-testing.txt -r requirements-testing.txt",
]
# pywin32 is only needed on Windows so that mayapy child processes can load
# win32file; on other platforms this constraint is a no-op.
dependencies = [
  "pywin32; sys_platform == 'win32'",
]

# Matrix across Maya versions. All renderers (mtoa, vray, redshift) are
# installed by default on Linux and Windows.
[[envs.integ-ci.matrix]]
maya = ["2025", "2026"]

[envs.integ-ci.env-vars]
MAYA_VERSION = "{matrix:maya}"
# Force unbuffered Python stdout/stderr so prints from setup-runner.py appear
# in CodeBuild's CloudWatch log in real time. Block-buffering hid a hung Maya
# silent installer for ~70 minutes — never again.
PYTHONUNBUFFERED = "1"

[envs.integ-ci.scripts]
# `python -u` is belt-and-suspenders alongside PYTHONUNBUFFERED=1; both are
# needed because hatch can launch sub-processes that don't always inherit env.
setup = "python -u ./pipeline/setup-runner.py --versions {matrix:maya} --renderers mtoa vray redshift {args}"
setup-mtoa = "python -u ./pipeline/setup-runner.py --versions {matrix:maya} --renderers mtoa {args}"
setup-vray = "python -u ./pipeline/setup-runner.py --versions {matrix:maya} --renderers vray {args}"
setup-redshift = "python -u ./pipeline/setup-runner.py --versions {matrix:maya} --renderers redshift {args}"
setup-all-renderers = "python -u ./pipeline/setup-runner.py --versions {matrix:maya} --renderers mtoa vray redshift {args}"
test = "python ./pipeline/run-integ-tests.py"
test-submitters = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "not adaptor"'
test-mtoa = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and mtoa_renderer"'
test-vray = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and vray_renderer"'
test-redshift = 'mayapy -m pytest --no-cov {args:test/integ} -vvv --numprocesses=1 -m "adaptor and redshift_renderer"'

[envs.e2e.scripts]
test = "pytest --no-cov {args:test/*/e2e}"

[envs.release]
detached = true

[envs.release.scripts]
deps = "pip install -r requirements-release.txt"
bump = "semantic-release -v --strict version --no-push --no-commit --no-tag --skip-build {args}"
version = "semantic-release -v --strict version --print {args}"

[envs.installer.scripts]
build-installer = "python {root}/scripts/build_installer_cli.py --installer-source-path {root}/installer/DeadlineCloudForMayaSubmitter.xml {args:}"
